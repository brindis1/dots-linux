[mgr]
prepend_keymap = [
  { on = "<Enter>", run = "plugin smart-enter", desc = "Entrar al directorio o abrir archivo" },
  { on = "e", run = "open", desc = "Abrir archivo seleccionado" },
  { on = "C", run = "plugin ouch", desc = "Comprimir archivos seleccionados con ouch" },
  { on = "E", run = 'shell --confirm "ouch d -y \"$@\""', desc = "Extraer archivo comprimido aquí con ouch" },
]

